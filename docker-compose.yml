services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_farma
      POSTGRES_USER: mcp_farma
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD nao configurada}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_farma -d mcp_farma"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
